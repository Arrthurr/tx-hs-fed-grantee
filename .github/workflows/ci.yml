# CI: advisory review, lint, typecheck, unit tests, committed-data
# invariants, production build, and deterministic Playwright coverage on
# every pull request and on pushes to main.
#
# Browser tests intercept the Google Maps SDK with a checked-in test double
# and start Vite with a synthetic non-credential key. They never contact
# Google and never receive repository secrets. Live Google Maps smoke is
# opt-in locally (`LIVE_GOOGLE_MAPS=1`) and is not run here, including on
# fork pull requests.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint / typecheck / test / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Advisory review
        run: npm run test:advisories

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test -- --ci

      - name: Committed data integrity and reproducible regions
        run: npm run test:data

      - name: Build
        run: npm run build

  e2e:
    name: playwright (sdk double)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Deterministic browser tests
        run: npm run test:e2e
        env:
          CI: true

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7
